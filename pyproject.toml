[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glasshouse"
version = "0.1.0"
description = "A private, local Wrapped report for coding-agent activity"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Glasshouse contributors"}]

[project.scripts]
glasshouse = "glasshouse.cli:main"

[tool.setuptools.package-data]
glasshouse = ["assets/*.png", "templates/*.html"]

[tool.setuptools.packages.find]
include = ["glasshouse*"]
